[package]
name = "mcpg-plugin"
version = "0.1.0-beta.17"
license = "Apache-2.0"
edition = "2024"
description = "Plugin artifact file-management CLI (pack / sign / push / pull / verify). Binary: `mcpg-plugin`."

# Crate, binary, and the `mcpg plugin <sub>` dispatch word all share one
# name. Scope: artifact file management only (pack / sign / push / pull /
# verify). Developer tooling (compiling plugins, generating signing keys,
# scaffolding crates, release automation) is handled by each plugin
# project's own toolchain — not this binary.

[dependencies]
mcpg-plugin-host = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
anyhow = "1.0"
clap = { version = "4", features = ["derive", "wrap_help"] }
# ed25519 only for `sign` (producing a signature against a caller-
# provided key) and `verify`. Key generation is out of scope — operators
# use `ssh-keygen -t ed25519` or any Ed25519 library.
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hex = "0.4"
sha2 = "0.10"
# `push` / `pull` against OCI registries are inherently async;
# we only spin up the runtime inside those two subcommands.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# `test` subcommand unpacks the packaged zip into a workdir; tempfile
# gives us an auto-cleaned tempdir scoped to the subcommand invocation.
tempfile = "3"
# `test` parses `PluginContext` JSON from disk → the `MockGateway`
# in the SDK, so we need serde_yaml for descriptor overrides and the
# SDK for the test harness types.
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
# subprocess-signer round-trip tests pre-compute an Ed25519
# signature, base64-encode it, then run a tiny shell script that
# decodes it back to raw bytes. base64 is dev-only — production
# `mcpg-plugin sign` doesn't touch base64.
base64 = "0.22"
